<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Poptropica CN localization pipeline</title>
  <desc id="desc">A bilingual project hero showing the archive, catalog, translation, patching, and local launcher stages</desc>
  <defs>
